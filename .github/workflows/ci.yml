name: ci

on:
  push:
    branches: [master, "vibe/**"]
  pull_request:
    branches: [master]

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore crap4csharp.sln

      - name: Build (Release, warnings-as-errors)
        run: dotnet build crap4csharp.sln --configuration Release --no-restore

      - name: Test (with coverage)
        run: >
          dotnet test crap4csharp.sln --configuration Release --no-build
          --collect:"XPlat Code Coverage" --results-directory coverage

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage-cobertura
          path: coverage/**/coverage.cobertura.xml
          if-no-files-found: ignore
