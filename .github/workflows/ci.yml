name: ci

on:
  push:
    branches: [master, "vibe/**"]
  pull_request:
    branches: [master]

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore crap4csharp.sln

      - name: Build (Release, warnings-as-errors)
        run: dotnet build crap4csharp.sln --configuration Release --no-restore

      - name: Test (with coverage)
        run: >
          dotnet test crap4csharp.sln --configuration Release --no-build
          --collect:"XPlat Code Coverage" --results-directory coverage

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-cobertura
          path: coverage/**/coverage.cobertura.xml
          if-no-files-found: ignore
